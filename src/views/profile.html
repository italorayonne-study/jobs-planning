<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="/public/styles/global.css">
    <link rel="stylesheet" href="/public/styles/pages/profile.css">
    <link rel="stylesheet" href="/public/styles/shared/card.css">
    <link rel="stylesheet" href="/public/styles/shared/form.css">

</head>

<body>
    <header class="header">
        <h1> Meu Perfil </h1>
    </header>
    <main class="container">
        <aside class="card">

            <img src="/public/images/shubaka.png" alt="foto de perfil">

            <h2>Shúbaka Régis</h2>

            <p>O valor da sua hora é <br /><strong>R$ -13,00 reais</strong></p>

            <button type="submit">Salvar dados</button>

        </aside>
        <section class="form">
            <form action="">
                <fieldset>
                    <legend>Dados do Perfil</legend>
                    <div class="separator"></div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="text" name="name" id="name" placeholder="Nome" />
                        </div>
                        <div class="input-wrapper margin-left">
                            <input type="url" name="avatar" id="avatar" placeholder="Nome" />
                        </div>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Planejamento</legend>
                    <div class="separator"></div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <label for="">Quanto eu <br />
                                quero ganhar por mês?</label>
                            <input type="number" placeholder="R$" />
                        </div>
                        <div class="input-wrapper margin-left">
                            <label for="">Quantas horas <br />
                                quero trabalhar por dia?</label>
                            <input type="number" />
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <label for="">Quantos dias <br />
                                quero trabalhar por semana?</label>
                            <input type="number" />
                        </div>
                        <div class="input-wrapper margin-left">
                            <label for="">Quantas semanas <br />
                                por ano você quer tirar férias?</label>
                            <input type="number" />
                        </div>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
</body>

</html>
