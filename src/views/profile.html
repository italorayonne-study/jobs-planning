<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link rel="stylesheet" href="/public/styles/global.css">
    <link rel="stylesheet" href="/public/styles/pages/profile.css">
    <link rel="stylesheet" href="/public/styles/shared/card.css">

</head>

<body>

    <header class="header">
        <h1> Meu Perfil </h1>
    </header>

    <main class="container">
        <aside class="card">

            <img src="/public/images/shubaka.png" alt="foto de perfil">

            <h2>Shúbaka Régis</h2>

            <p>O valor da sua hora é <br /><strong>R$ -13,00 reais</strong></p>

            <button type="submit">Salvar dados</button>
            
        </aside>

        <section class="form">
             
            <form action="">
                
                <fieldset>
                    <legend>Dados do perfil</legend>
                </fieldset>
                <div class="separator"></div>
                
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="text" name="name" id="idname" placeholder="Nome">
                        </div>
                        <div class="input-wrapper"><input type="url" name="url" id="idurl" placeholder="Link da foto"></div>
                    
                    </div>
               

            </form>
            
            <form action="">
                
                <fieldset>
                    <legend>Planejamento</legend>
                </fieldset>
                
                <div class="separator"></div>
                
                <div class="input-group">
                    
                    <div class="input-wrapper">
                        
                        <label for="idnumber">Quanto eu <br>quero ganhar por mês?</label>                        
                        <input type="number" name="number" id="idnumber" placeholder="R$">
                    
                    </div>
                    
                    <div class="input-wrapper">
                        
                        <label for="idhours">Quantas horas <br> quero trabalhar por dia ?</label>    
                        <input type="number" name="hours" id="idhours">
                    
                    </div>
                
                </div>
                
                <div class="input-group">
                    
                    <div class="input-wrapper">
                        
                        <label for="idweek">Quantos dias quero <br> trabalhar por semana?</label>
                        <input type="number" name="week" id="idweek">
                    
                    </div>
                    
                    <div class="input-wrapper">
                        
                        <label for="idholiday">Quantas semanas <br> por ano você quer tirar férias ?</label>
                        <input type="number" name="holiday" id="idholiday">
                    
                    </div>
                
                </div>
                
            </form>
        </section>
    </main>
    
</body>

</html>
